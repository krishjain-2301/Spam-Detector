<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Analysis Results</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #2a2a2a;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      padding: 32px;
    }
    .title {
      font-size: 1.8em;
      font-weight: 600;
      margin-bottom: 24px;
      text-align: center;
      color: #fff;
      border-bottom: 2px solid #444;
      padding-bottom: 16px;
    }
    .analysis-section {
      background: #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 16px;
      color: #fff;
    }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    .info-item {
      background: #404040;
      padding: 12px;
      border-radius: 6px;
    }
    .info-label {
      font-weight: 500;
      color: #aaa;
      margin-bottom: 4px;
    }
    .info-value {
      color: #fff;
    }
    .risk-high {
      color: #ff4444;
    }
    .risk-medium {
      color: #ffaa33;
    }
    .risk-low {
      color: #44bb44;
    }
    .warnings-list {
      list-style: none;
      padding: 0;
    }
    .warning-item {
      background: #403030;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid #ff4444;
    }
    .recommendation-item {
      background: #304030;
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 8px;
      border-left: 4px solid #44bb44;
    }
    .anim {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 60px;
      margin-bottom: 18px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #44bb44;
      margin: 0 6px;
      opacity: 0.7;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-18px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="title">Sandbox Analysis Results</h1>
    
    <div class="anim" id="sandbox-anim">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    
    <div id="sandbox-results" style="display:none;"></div>
    <div class="no-results" id="sandbox-no-results" style="display:none;">
      No files to analyze.
    </div>
  </div>

  <script>
    window.electronAPI.onSandboxResults((results) => {
      document.getElementById('sandbox-anim').style.display = 'none';
      const resultsContainer = document.getElementById('sandbox-results');
      const noResultsDiv = document.getElementById('sandbox-no-results');
      
      if (results && results.length > 0) {
        resultsContainer.style.display = 'block';
        noResultsDiv.style.display = 'none';
        
        resultsContainer.innerHTML = results.map(item => {
          const result = item.result;
          if (!result.ok) {
            return `
              <div class="analysis-section">
                <div class="section-title">Error Analyzing ${item.name}</div>
                <div class="info-item">
                  <div class="info-value">${result.error}</div>
                </div>
              </div>
            `;
          }
          
          return `
            <div class="analysis-section">
              <div class="section-title">${item.name}</div>
              
              <div class="section-title">File Information</div>
              <div class="info-grid">
                <div class="info-item">
                  <div class="info-label">File Type</div>
                  <div class="info-value">${result.fileType}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Size</div>
                  <div class="info-value">${formatBytes(result.fileInfo.size)}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Last Modified</div>
                  <div class="info-value">${new Date(result.fileInfo.modified).toLocaleString()}</div>
                </div>
                <div class="info-item">
                  <div class="info-label">Extension</div>
                  <div class="info-value">${result.fileInfo.extension}</div>
                </div>
              </div>

              ${result.contentAnalysis ? `
                <div class="section-title">Content Analysis</div>
                <div class="info-grid">
                  <div class="info-item">
                    <div class="info-label">File Length</div>
                    <div class="info-value">${result.contentAnalysis.length} characters</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Number of Lines</div>
                    <div class="info-value">${result.contentAnalysis.lines}</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Contains Scripts</div>
                    <div class="info-value">${result.contentAnalysis.containsScripts ? '⚠️ Yes' : '✅ No'}</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Contains URLs</div>
                    <div class="info-value">${result.contentAnalysis.containsUrls.length} found</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Contains Base64</div>
                    <div class="info-value">${result.contentAnalysis.containsBase64 ? '⚠️ Yes' : '✅ No'}</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Contains Shell Commands</div>
                    <div class="info-value">${result.contentAnalysis.containsShellCommands ? '⚠️ Yes' : '✅ No'}</div>
                  </div>
                </div>
              ` : ''}

              ${result.binaryAnalysis ? `
                <div class="section-title">Binary Analysis</div>
                <div class="info-grid">
                  <div class="info-item">
                    <div class="info-label">Is Executable</div>
                    <div class="info-value">${result.binaryAnalysis.isExecutable ? '⚠️ Yes' : '✅ No'}</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Potentially Harmful</div>
                    <div class="info-value">${result.binaryAnalysis.isPotentiallyHarmful ? '⚠️ Yes' : '✅ No'}</div>
                  </div>
                  <div class="info-item">
                    <div class="info-label">Signed</div>
                    <div class="info-value">${result.binaryAnalysis.signatures.isSigned ? '✅ Yes' : '⚠️ No'}</div>
                  </div>
                </div>
              ` : ''}

              <div class="section-title">Risk Assessment</div>
              <div class="info-item">
                <div class="info-label">Risk Level</div>
                <div class="info-value risk-${result.riskAssessment.riskLevel}">
                  ${result.riskAssessment.riskLevel.toUpperCase()}
                </div>
              </div>

              ${result.riskAssessment.warnings.length > 0 ? `
                <div class="section-title">Warnings</div>
                <ul class="warnings-list">
                  ${result.riskAssessment.warnings.map(warning => `
                    <li class="warning-item">${warning}</li>
                  `).join('')}
                </ul>
              ` : ''}

              ${result.riskAssessment.recommendations.length > 0 ? `
                <div class="section-title">Recommendations</div>
                <ul class="warnings-list">
                  ${result.riskAssessment.recommendations.map(rec => `
                    <li class="recommendation-item">${rec}</li>
                  `).join('')}
                </ul>
              ` : ''}
            </div>
          `;
        }).join('');
      } else {
        resultsContainer.style.display = 'none';
        noResultsDiv.style.display = 'block';
      }
    });

    function formatBytes(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }
  </script>
</body>
</html>
